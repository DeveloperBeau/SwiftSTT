name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Swift 6.4
        uses: DeveloperBeau/resolve-swift@v2
        with:
          swift-version: '6.4'

      - name: Swift version
        run: swift --version

      - name: Cache whisper.xcframework
        uses: actions/cache@v4
        with:
          path: .whisper
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/bootstrap-whisper.sh', 'Package.swift') }}

      - name: Bootstrap whisper.xcframework
        run: |
          command -v cmake >/dev/null || brew install cmake
          scripts/bootstrap-whisper.sh

      - name: Build (debug)
        run: swift build -c debug

      - name: Build (release)
        run: swift build -c release

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: |
            .build/debug/codecov/
            .build/*/debug/codecov/
          if-no-files-found: ignore
